<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tường Chia Sẻ</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}body{background:#f0f2f5;margin:0;padding:15px;color:#333}
.hd{text-align:center;margin-bottom:15px}.hd h1{margin:0;color:#1a73e8;font-size:26px;cursor:pointer}
.qr{text-align:center;margin-bottom:15px}.qr button{background:#34a853;color:#fff;border:0;padding:8px 15px;border-radius:20px;font-weight:700}
#qrB{display:none;margin-top:10px;background:#fff;padding:12px;border-radius:10px}
.box{max-width:500px;margin:0 auto 20px;background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;font-size:15px}
.cols{display:flex;gap:10px;margin-bottom:12px;align-items:center}.dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid #ccc}
.dot.act{border-color:#000;transform:scale(1.15)}.btn{width:100%;padding:12px;background:#1a73e8;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:700}
.wall{column-count:3;column-gap:12px;max-width:1000px;margin:0 auto}@media(max-width:768px){.wall{column-count:1}}
.card{break-inside:avoid;margin-bottom:12px;padding:15px;border-radius:10px;box-shadow:0 2px 6px #0001}
.ft{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#666;border-top:1px solid #0001;padding-top:6px}
.del{background:#d93025;color:#fff;border:0;border-radius:4px;padding:2px 6px;display:none}body.adm .del{display:inline-block}
</style>
</head>
<body>
<div class="hd"><h1 id="tt" onclick="adm()">Tường Chia Sẻ</h1><p style="margin:4px 0;color:#666;font-size:14px">Gửi lời nhắn ẩn danh lên bảng chung</p></div>
<div class="qr"><button onclick="tQR()">📱 Hiện mã QR để người khác quét</button><div id="qrB"><img id="qrI" width="180" height="180"><p style="margin:5px 0 0;font-size:12px">Quét mã để vào viết bài</p></div></div>
<div class="box">
<input id="au" maxlength="40" placeholder="Biệt danh (bỏ trống sẽ hiện Ẩn danh)">
<textarea id="ct" rows="3" maxlength="500" placeholder="Nhập thông tin bạn muốn chia sẻ..."></textarea>
<div class="cols"><span>Màu:</span><div class="dot act" style="background:#fff" onclick="sc(this,'#fff')"></div><div class="dot" style="background:#fff9c4" onclick="sc(this,'#fff9c4')"></div><div class="dot" style="background:#e1f5fe" onclick="sc(this,'#e1f5fe')"></div><div class="dot" style="background:#e8f5e9" onclick="sc(this,'#e8f5e9')"></div><div class="dot" style="background:#fce4ec" onclick="sc(this,'#fce4ec')"></div></div>
<button class="btn" id="sb" onclick="post()">Đăng lên tường</button>
</div>
<div class="wall" id="wl"></div>
<script>
const API=["https:/","firestore.googleapis.com","v1","projects","tuong-chia-se","databases","(default)","documents","wall_posts"].join("/");
let col="#fff",clicks=0;
function tQR(){const b=document.getElementById("qrB");if(b.style.display!=="inline-block"){document.getElementById("qrI").src="https://quickchart.io"+encodeURIComponent(location.href);b.style.display="inline-block"}else b.style.display="none"}
function sc(el,c){document.querySelectorAll(".dot").forEach(x=>x.classList.remove("act"));el.classList.add("act");col=c}
function adm(){clicks++;setTimeout(()=>clicks=0,600);if(clicks>=2){clicks=0;if(document.body.classList.toggle("adm"))if(prompt("Mật khẩu Admin:")!=="123456")document.body.classList.remove("adm")}}
async function post(){
const ct=document.getElementById("ct").value.trim();if(!ct)return alert("Bạn chưa nhập nội dung!");
const btn=document.getElementById("sb");btn.disabled=true;btn.innerText="Đang đăng...";
try{
const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{author:{stringValue:document.getElementById("au").value.trim()||"Ẩn danh"},content:{stringValue:ct},color:{stringValue:col},reports:{integerValue:"0"},ts:{integerValue:String(Date.now())}}})});
if(!r.ok)throw new Error("Mã lỗi "+r.status);
document.getElementById("ct").value="";await load();
}catch(e){alert("Không đăng được: "+e.message)}
btn.disabled=false;btn.innerText="Đăng lên tường"}
async function load(){
try{
const r=await fetch(API+"?pageSize=100");const d=await r.json();const w=document.getElementById("wl");
if(!d.documents){w.innerHTML="";return}
const items=d.documents.map(x=>{const f=x.fields||{};return{id:x.name.split("/").pop(),au:f.author?.stringValue||"Ẩn danh",ct:f.content?.stringValue||"",c:f.color?.stringValue||"#fff",rp:Number(f.reports?.integerValue||0),ts:Number(f.ts?.integerValue||0)}}).sort((a,b)=>b.ts-a.ts);
w.innerHTML=items.map(v=>{const h=v.rp>=3;return`<div class="card" style="background:${v.c};${h?"opacity:0.5":""}"><b>${v.au.replace(/</g,"&lt;")}</b> ${v.rp>0?`<small style="color:red">(🚩${v.rp})</small>`:""}<p style="white-space:pre-wrap;margin:8px 0">${h&&!document.body.classList.contains("adm")?"<i>[Bài viết đang tạm ẩn]</i>":v.ct.replace(/</g,"&lt;")}</p><div class="ft"><span>${v.ts?new Date(v.ts).toLocaleString("vi-VN"):"Vừa xong"}</span><div><button style="border:0;background:none;color:#d93025" onclick="rep('${v.id}',${v.rp})">🚩 Báo cáo</button><button class="del" onclick="del('${v.id}')">Xóa</button></div></div></div>`}).join("");
}catch(e){}}
async function rep(id,cur){if(confirm("Báo cáo bài này?")){await fetch(API+"/"+id+"?updateMask.fieldPaths=reports",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{reports:{integerValue:String(cur+1)}}})});load()}}
async function del(id){if(confirm("Xóa vĩnh viễn?")){await fetch(API+"/"+id,{method:"DELETE"});load()}}
load();setInterval(load,4000);
</script>
</body>
</html>
